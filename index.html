<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학 자연계열 이수권장과목 조회 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #F5F6FA;
            color: #2C3E50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 5px;
            color: #2C3E50;
        }
        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #7F8C8D;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #BDC3C7;
            border-radius: 6px;
            background-color: #FAFAFA;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #3498DB;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498DB;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980B9;
        }
        .result-area {
            margin-top: 30px;
            border-top: 2px dashed #BDC3C7;
            display: none;
        }
        .result-main-title {
            font-size: 18px;
            font-weight: bold;
            color: #2C3E50;
            margin: 20px 0 15px 0;
            text-align: center;
            background: #E8F4F8;
            padding: 10px;
            border-radius: 6px;
        }
        .university-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .result-line {
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .result-title {
            font-weight: bold;
            color: #2C3E50;
        }
        .box {
            background-color: #F8F9FA;
            padding: 12px;
            border-radius: 6px;
            margin-top: 5px;
            border-left: 4px solid #3498DB;
        }
        .box.core { border-left-color: #E74C3C; }
        .box.recom { border-left-color: #E67E22; }
        .notice {
            font-size: 12px;
            color: #7F8C8D;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 이수권장과목 조회 시스템</h1>
    <p class="subtitle">동일한 학과의 여러 대학 기준을 한눈에 비교해보세요.</p>

    <div class="form-group">
        <label>🏫 1단계 계열 선택</label>
        <select id="groupSelect">
            <option value="">데이터를 불러오는 중입니다...</option>
        </select>
    </div>

    <div class="form-group">
        <label>🎓 2단계 학과 선택</label>
        <select id="deptSelect" disabled>
            <option value="">계열을 먼저 선택해 주세요</option>
        </select>
    </div>

    <button id="searchBtn">선택한 학과 과목 조회하기</button>

    <div class="result-area" id="resultArea">
        <div class="result-main-title">🔍 <span id="mainDeptTitle"></span> 조회 결과</div>
        <div id="cardsContainer"></div>
        <p class="notice">※ 고교 내 미개설 과목은 외부 공동교육과정 이수를 권장합니다.</p>
    </div>
</div>

<script>
    let allData = [];

    // 데이터 로드 및 전체 공백 클리닝 작업 엔진
    function loadData() {
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error();
                return response.json();
            })
            .then(data => { processAndInit(data); })
            .catch(() => {
                fetch('Data.json')
                    .then(response => response.json())
                    .then(data => { processAndInit(data); })
                    .catch(err => {
                        alert('데이터 파일(data.json)을 저장소에서 찾을 수 없습니다.');
                        console.error(err);
                    });
            });
    }

    // 💡 [핵심 교정] 데이터 연동 시 내부 모든 문자열의 유령 공백을 미리 완전히 청소합니다.
    function processAndInit(data) {
        allData = data.map(item => {
            return {
                "대학": String(item['대학'] || '').trim(),
                "단과대학/계열": String(item['단과대학/계열'] || '').trim(),
                "학과(부)": String(item['학과(부)'] || '').trim(),
                "핵심과목": String(item['핵심과목'] || '').trim(),
                "권장과목": String(item['권장과목'] || '').trim()
            };
        });
        initGroupDropdown();
    }

    loadData();

    // 1단계 계열 선택창 채우기
    function initGroupDropdown() {
        const groupSelect = document.getElementById('groupSelect');
        const groups = [...new Set(allData.map(item => item['단과대학/계열']))].sort();
        
        groupSelect.innerHTML = '<option value="">-- 계열을 선택하세요 --</option>';
        groups.forEach(group => {
            const opt = document.createElement('option');
            opt.value = group;
            opt.textContent = group;
            groupSelect.appendChild(opt);
        });

        groupSelect.addEventListener('change', onGroupChange);
    }

    // 2단계 학과 선택창 동적 연동 (중복 완전 박멸)
    function onGroupChange(e) {
        const selectedGroup = e.target.value;
        const deptSelect = document.getElementById('deptSelect');
        
        if (!selectedGroup) {
            deptSelect.innerHTML = '<option value="">계열을 먼저 선택해 주세요</option>';
            deptSelect.disabled = true;
            return;
        }

        deptSelect.innerHTML = '<option value="">-- 학과를 선택하세요 --</option>';
        
        // 데이터 정제가 미리 처리되었으므로 Set 구조가 완벽하게 작동합니다.
        const filteredDepts = allData.filter(item => item['단과대학/계열'] === selectedGroup);
        const uniqueDeptNames = [...new Set(filteredDepts.map(item => item['학과(부)']))].sort();
        
        uniqueDeptNames.forEach(deptName => {
            const opt = document.createElement('option');
            opt.value = deptName; 
            opt.textContent = deptName; 
            deptSelect.appendChild(opt);
        });

        deptSelect.disabled = false;
    }

    // [조회하기] 버튼 클릭 시 매칭되는 모든 정보 일괄 출력
    document.getElementById('searchBtn').addEventListener('click', () => {
        const groupSelect = document.getElementById('groupSelect');
        const deptSelect = document.getElementById('deptSelect');
        
        const selectedGroup = groupSelect.value;
        const selectedDeptName = deptSelect.value;

        if (!selectedDeptName) {
            alert('조회할 세부 학과를 먼저 선택해 주세요.');
            return;
        }

        // 선택된 계열과 학과명에 부합하는 모든 레코드 수집
        const matchedRecords = allData.filter(item => 
            item['단과대학/계열'] === selectedGroup && item['학과(부)'] === selectedDeptName
        );

        document.getElementById('mainDeptTitle').textContent = selectedDeptName;
        const cardsContainer = document.getElementById('cardsContainer');
        cardsContainer.innerHTML = '';

        // 매칭된 정보의 개수만큼 카드를 나열
        matchedRecords.forEach(target => {
            const card = document.createElement('div');
            card.className = 'university-card';
            
            card.innerHTML = `
                <div class="result-line"><span class="result-title">ℹ️ 정보 출처 :</span> <span>${target['대학']}</span></div>
                <div class="result-line"><span class="result-title">📂 소속 계열 :</span> <span>${target['단과대학/계열']}</span></div>
                <div class="result-line" style="margin-top: 15px;">
                    <span class="result-title" style="color: #E74C3C;">🔴 [핵심과목] (필수 이수 권장)</span>
                    <div class="box core">👉 ${target['핵심과목']}</div>
                </div>
                <div class="result-line">
                    <span class="result-title" style="color: #E67E22;">🟠 [권장과목] (가급적 이수 권장)</span>
                    <div class="box recom">👉 ${target['권장과목']}</div>
                </div>
            `;
            cardsContainer.appendChild(card);
        });

        document.getElementById('resultArea').style.display = 'block';
    });
</script>
</body>
</html>
